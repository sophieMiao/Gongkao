version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gongkao-db
    environment:
      POSTGRES_USER: gongkao
      POSTGRES_PASSWORD: gongkao123
      POSTGRES_DB: gongkao
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma:/app/prisma
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gongkao"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gongkao-server
    environment:
      DATABASE_URL: "postgresql://gongkao:gongkao123@db:5432/gongkao"
      JWT_SECRET: "your-super-secret-jwt-key-change-this"
      PORT: 8080
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/prisma/migrations:/app/prisma/migrations
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
