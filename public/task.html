<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考公学习伴侣 - 每日任务</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .header .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      margin-top: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #ffd700;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .content {
      padding: 30px 20px;
    }

    .task-info {
      margin-bottom: 30px;
    }

    .task-info h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 10px;
    }

    .task-info .meta {
      display: flex;
      gap: 15px;
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .task-info .meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .question-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option:hover {
      border-color: #4facfe;
      background: #f0f8ff;
    }

    .option.selected {
      border-color: #4facfe;
      background: #e6f2ff;
    }

    .option.correct {
      border-color: #4caf50;
      background: #e8f5e9;
    }

    .option.incorrect {
      border-color: #f44336;
      background: #ffebee;
    }

    .option-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .option.selected .option-letter {
      background: #4facfe;
      color: white;
    }

    .option.correct .option-letter {
      background: #4caf50;
      color: white;
    }

    .option.incorrect .option-letter {
      background: #f44336;
      color: white;
    }

    .option-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #666;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .explanation {
      margin-top: 20px;
      padding: 15px;
      background: #fff8e1;
      border-radius: 10px;
      border-left: 4px solid #ffc107;
      display: none;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .explanation.show {
      display: block;
    }

    .explanation h4 {
      color: #f57c00;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .explanation p {
      color: #666;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .explanation .section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #ffc107;
    }

    .explanation .section-title {
      font-weight: bold;
      color: #f57c00;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .knowledge-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .knowledge-tag {
      background: #e3f2fd;
      color: #1976d2;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }

    .similar-questions {
      margin-top: 15px;
      padding: 12px;
      background: #f3e5f5;
      border-radius: 8px;
    }

    .similar-questions p {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .btn-small {
      display: inline-block;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid #9c27b0;
      color: #9c27b0;
      border-radius: 15px;
      font-size: 12px;
      text-decoration: none;
      margin-right: 8px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .btn-small:hover {
      background: #9c27b0;
      color: white;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #4facfe;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }

    .flip-card {
      perspective: 1000px;
      margin-bottom: 20px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: left;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      padding: 20px;
      background: #f8f9fa;
    }

    .flip-card-back {
      transform: rotateY(180deg);
      background: #fff8e1;
    }

    .timer {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-top: 10px;
    }

    .timer span {
      color: #4facfe;
      font-weight: bold;
      font-size: 18px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #eee;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .header {
        padding: 20px 15px;
      }
      .content {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 考公学习伴侣</h1>
      <div class="subtitle">第 <span id="day-number">1</span> 天任务</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div class="content">
      <div class="stats-bar">
        <div class="stat-item">
          <div class="stat-value" id="today-progress">1/10</div>
          <div class="stat-label">今日进度</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="accuracy-rate">--%</div>
          <div class="stat-label">正确率</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="knowledge-mastery">--%</div>
          <div class="stat-label">本知识点掌握度</div>
        </div>
      </div>

      <div class="task-info">
        <h2 id="knowledge-point">数量关系-工程问题</h2>
        <div class="meta">
          <span>⏱️ 预计 <span id="estimated-time">5</span> 分钟</span>
          <span>💎 <span id="points">15</span> 积分</span>
          <span>🔥 连续 <span id="streak">0</span> 天</span>
        </div>
      </div>

      <div class="flip-card" id="question-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <div class="question-text" id="question-content">
              甲乙合作完成一项工程需要10天，甲单独做需要15天，乙单独做需要多少天？
            </div>
            <div class="options" id="options">
              <!-- 选项将通过 JS 动态生成 -->
            </div>
          </div>
          <div class="flip-card-back">
            <h4>📖 解析</h4>
            <div id="explanation-content">
              <!-- 解析内容 -->
            </div>
            <div class="knowledge-tags" id="knowledge-tags">
              <!-- 知识点标签 -->
            </div>
            <div class="similar-questions" id="similar-questions" style="display: none;">
              <p><strong>💡 同类题推荐</strong></p>
              <div id="similar-list"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="timer">
        用时：<span id="timer">0</span> 秒
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="skipQuestion()">跳过</button>
        <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()">提交答案</button>
        <button class="btn btn-secondary" id="next-btn" onclick="nextQuestion()" style="display: none;">下一题</button>
      </div>
    </div>

    <div class="footer">
      <p>考公学习伴侣 · 让每一天都有进步</p>
    </div>
  </div>

  <script>
    // 全局状态
    let currentTask = null;
    let selectedOption = null;
    let startTime = null;
    let timerInterval = null;

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const taskId = urlParams.get('task_id');
      const userId = urlParams.get('user');
      
      if (!taskId || !userId) {
        alert('缺少任务参数');
        window.close();
        return;
      }

      await loadTask(taskId, userId);
      startTimer();
      updateProgressDisplay();
    });

    // 加载任务详情
    async function loadTask(taskId, userId) {
      try {
        const response = await fetch(`/api/v1/tasks/${taskId}?user_id=${userId}`);
        if (!response.ok) {
          throw new Error('Failed to load task');
        }
        
        const data = await response.json();
        currentTask = data;
        
        // 渲染题目
        document.getElementById('day-number').textContent = data.day_number || 1;
        document.getElementById('knowledge-point').textContent = data.knowledge_point;
        document.getElementById('estimated-time').textContent = data.estimated_minutes || 5;
        document.getElementById('points').textContent = data.points_available;
        document.getElementById('streak').textContent = data.streak || 0;
        document.getElementById('question-content').textContent = data.content;
        
        // 更新进度显示
        document.getElementById('today-progress').textContent = `${data.completed_tasks || 0}/${data.total_tasks || 10}`;
        
        // 渲染选项
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';
        
        const letters = ['A', 'B', 'C', 'D'];
        data.options.forEach((opt, idx) => {
          const optionEl = document.createElement('div');
          optionEl.className = 'option';
          optionEl.dataset.letter = letters[idx];
          optionEl.dataset.value = opt; // 假设选项就是答案值
          optionEl.innerHTML = `
            <div class="option-letter">${letters[idx]}</div>
            <div class="option-text">${opt}</div>
          `;
          optionEl.onclick = () => selectOption(optionEl);
          optionsContainer.appendChild(optionEl);
        });
        
      } catch (error) {
        console.error('加载任务失败:', error);
        alert('加载任务失败，请重试');
      }
    }

    // 更新进度显示
    async function updateProgressDisplay() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('user');
      
      try {
        const response = await fetch(`/api/v1/users/${userId}/progress?date=${new Date().toISOString().split('T')[0]}`);
        if (response.ok) {
          const data = await response.json();
          
          // 更新今日进度
          const todayProgress = document.getElementById('today-progress');
          if (todayProgress) {
            todayProgress.textContent = `${data.completed_tasks || 0}/${data.total_tasks || 10}`;
          }
          
          // 更新正确率
          const accuracyRate = document.getElementById('accuracy-rate');
          if (accuracyRate) {
            accuracyRate.textContent = data.accuracy ? `${Math.round(data.accuracy * 100)}%` : '--%';
          }
          
          // 更新知识点掌握度（取当前知识点的正确率）
          const knowledgeMastery = document.getElementById('knowledge-mastery');
          const currentKp = currentTask?.knowledge_point;
          if (knowledgeMastery && currentKp && data.knowledge_point_accuracy?.[currentKp]) {
            const accuracy = data.knowledge_point_accuracy[currentKp];
            knowledgeMastery.textContent = `${Math.round(accuracy * 100)}%`;
            
            // 根据掌握度改变颜色
            if (accuracy >= 0.8) {
              knowledgeMastery.style.color = '#4caf50';
            } else if (accuracy >= 0.6) {
              knowledgeMastery.style.color = '#ff9800';
            } else {
              knowledgeMastery.style.color = '#f44336';
            }
          } else if (knowledgeMastery) {
            knowledgeMastery.textContent = '--%';
          }
        }
      } catch (error) {
        console.error('获取进度失败:', error);
      }
    }

    // 选择选项
    function selectOption(optionEl) {
      // 清除之前的选择
      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      optionEl.classList.add('selected');
      selectedOption = optionEl.dataset.letter;
    }

    // 提交答案
    async function submitAnswer() {
      if (!selectedOption) {
        alert('请选择答案');
        return;
      }
      
      const urlParams = new URLSearchParams(window.location.search);
      const taskId = urlParams.get('task_id');
      const userId = urlParams.get('user');
      
      const response = await fetch(`/api/v1/tasks/${taskId}/answer`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_answer: selectedOption,
          time_spent_seconds: Math.floor((Date.now() - startTime) / 1000)
        })
      });
      
      if (!response.ok) {
        alert('提交失败，请重试');
        return;
      }
      
      const result = await response.json();
      
      // 显示结果
      showResult(result);
    }

    // 显示答题结果（翻转卡片）
    function showResult(result) {
      const card = document.getElementById('question-card');
      const options = document.querySelectorAll('.option');
      const correctAnswer = currentTask.correct_answer;
      
      // 标记正确/错误
      options.forEach(opt => {
        if (opt.dataset.value === correctAnswer) {
          opt.classList.add('correct');
        } else if (opt.dataset.letter === result.user_answer && !result.correct) {
          opt.classList.add('incorrect');
        }
      });
      
      // 显示解析内容（在卡片背面）
      const explanationContent = document.getElementById('explanation-content');
      let html = '';
      
      if (result.correct) {
        html += `<p style="color: #4caf50; font-weight: bold; margin-bottom: 10px;">✅ 回答正确！${result.points_earned > 0 ? '获得'+result.points_earned+'积分' : ''}</p>`;
      } else {
        html += `<p style="color: #f44336; font-weight: bold; margin-bottom: 10px;">❌ 回答错误</p>`;
        html += `<p><strong>正确答案：</strong>${correctAnswer}</p>`;
        html += `<p><strong>你的答案：</strong>${result.user_answer}</p>`;
      }
      
      html += `<div class="section"><div class="section-title">📖 详细解析</div><p>${result.explanation || '暂无解析'}</p></div>`;
      
      // 知识点标签
      if (result.knowledge_points && result.knowledge_points.length > 0) {
        html += `<div class="section"><div class="section-title">🔗 相关知识点</div><div class="knowledge-tags">`;
        result.knowledge_points.forEach(kp => {
          html += `<span class="knowledge-tag">${kp}</span>`;
        });
        html += `</div></div>`;
      }
      
      // 同类题推荐
      if (result.similar_questions && result.similar_questions.length > 0) {
        html += `<div class="similar-questions"><p><strong>💡 同类题推荐</strong></p><div id="similar-list">`;
        result.similar_questions.forEach((sq, idx) => {
          html += `<a href="javascript:void(0)" class="btn-small" onclick="loadSimilarQuestion(${sq.id})">第${idx + 1}题（${sq.difficulty}）</a>`;
        });
        html += `</div></div>`;
      }
      
      explanationContent.innerHTML = html;
      
      // 翻转卡片显示背面
      card.classList.add('flipped');
      
      // 更新按钮状态
      document.getElementById('submit-btn').style.display = 'none';
      document.getElementById('next-btn').style.display = 'inline-block';
      
      // 停止计时
      clearInterval(timerInterval);
      
      // 更新全局进度
      updateProgressDisplay();
    }

    // 加载同类题（待实现）
    function loadSimilarQuestion(similarId) {
      alert('同类题功能开发中...');
    }

    // 跳过题目
    function skipQuestion() {
      if (confirm('确定要跳过这道题吗？将不会获得积分。')) {
        // 直接标记为完成，不计分
        // TODO: 调用 skip API
        alert('已跳过');
        window.close();
      }
    }

    // 下一题
    function nextQuestion() {
      // 获取当前任务总数和已完成数，判断是否还有下一题
      const progressText = document.getElementById('today-progress').textContent;
      const [completed, total] = progressText.split('/').map(Number);
      
      if (completed < total) {
        // 刷新页面或加载下一个任务ID
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user');
        // TODO: 获取下一个任务ID
        window.location.reload();
      } else {
        alert('今日任务已完成！明天继续加油！');
        window.close();
      }
    }

    // 计时器
    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const seconds = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = seconds;
      }, 1000);
    }
  </script>
</body>
</html>
