global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'kaogong-agent'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    # 需要安装 postgres_exporter

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    # 需要安装 redis_exporter

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    # Qdrant 自带 metrics 端点
