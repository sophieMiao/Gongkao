<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <title>考公学习伴侣 - 学习数据</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --primary: #4facfe;
      --secondary: #00f2fe;
      --accent: #ffd700;
      --success: #4caf50;
      --warning: #ff9800;
      --error: #f44336;
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #333;
      --text-secondary: #666;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-header h1 { font-size: 22px; }
    .app-header .subtitle { font-size: 14px; opacity: 0.9; margin-top: 4px; }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .summary-card .value {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .summary-card .label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .chart-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
    }

    .chart-card h3 {
      font-size: 16px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-container {
      position: relative;
      height: 250px;
    }

    .chart-container.tall { height: 300px; }

    .streak-section {
      background: linear-gradient(135deg, #ff9a56, #ff6f61);
      border-radius: var(--radius);
      padding: 25px;
      margin-bottom: 15px;
      color: white;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .streak-section .streak-count {
      font-size: 48px;
      font-weight: 800;
    }

    .streak-section .streak-label {
      font-size: 16px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .knowledge-list {
      list-style: none;
    }

    .knowledge-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .knowledge-item:last-child { border-bottom: none; }

    .knowledge-item .name {
      flex: 1;
      font-size: 15px;
    }

    .knowledge-item .bar-container {
      width: 120px;
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      margin: 0 12px;
      overflow: hidden;
    }

    .knowledge-item .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease;
    }

    .knowledge-item .percentage {
      font-size: 14px;
      font-weight: 600;
      width: 45px;
      text-align: right;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #eee;
      z-index: 100;
    }

    .nav-item {
      text-align: center;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      padding: 5px 15px;
      text-decoration: none;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item .icon { font-size: 22px; display: block; }

    body { padding-bottom: 70px; }

    @media (max-width: 600px) {
      .summary-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .summary-card .value { font-size: 26px; }
      .chart-container { height: 200px; }
      .chart-container.tall { height: 250px; }
    }

    @media (min-width: 600px) {
      .summary-cards { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>📊 学习数据</h1>
    <div class="subtitle" id="user-name">加载中...</div>
  </div>

  <div class="container">
    <!-- 概览卡片 -->
    <div class="summary-cards">
      <div class="summary-card">
        <div class="value" id="total-days">0</div>
        <div class="label">学习天数</div>
      </div>
      <div class="summary-card">
        <div class="value" id="total-questions">0</div>
        <div class="label">答题总数</div>
      </div>
      <div class="summary-card">
        <div class="value" id="accuracy-rate">0%</div>
        <div class="label">正确率</div>
      </div>
      <div class="summary-card">
        <div class="value" id="total-points">0</div>
        <div class="label">总积分</div>
      </div>
    </div>

    <!-- 连续学习 -->
    <div class="streak-section">
      <div class="streak-count" id="streak-count">🔥 0</div>
      <div class="streak-label">连续学习天数</div>
    </div>

    <!-- 今日进度 -->
    <div class="chart-card">
      <h3>📈 今日学习进度</h3>
      <div class="chart-container">
        <canvas id="progress-chart"></canvas>
      </div>
    </div>

    <!-- 知识点掌握 -->
    <div class="chart-card">
      <h3>🎯 知识点掌握</h3>
      <div class="chart-container tall">
        <canvas id="knowledge-chart"></canvas>
      </div>
    </div>

    <!-- 学习时间分布 -->
    <div class="chart-card">
      <h3>⏰ 学习时间分布</h3>
      <div class="chart-container">
        <canvas id="time-distribution-chart"></canvas>
      </div>
    </div>

    <!-- 分数趋势 -->
    <div class="chart-card">
      <h3>📈 分数趋势（30天）</h3>
      <div class="chart-container">
        <canvas id="score-trend-chart"></canvas>
      </div>
    </div>

    <!-- 知识点详细列表 -->
    <div class="chart-card">
      <h3>📚 知识点掌握详情</h3>
      <ul class="knowledge-list" id="knowledge-list">
        <!-- 动态生成 -->
      </ul>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav-bar">
    <a class="nav-item" href="/task.html">
      <span class="icon">📝</span>
      答题
    </a>
    <a class="nav-item active" href="/dashboard.html">
      <span class="icon">📊</span>
      数据
    </a>
    <a class="nav-item" href="/profile.html">
      <span class="icon">👤</span>
      我的
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/js/stats-dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('user') || '1';

      // 设置模拟数据
      document.getElementById('total-days').textContent = '15';
      document.getElementById('total-questions').textContent = '127';
      document.getElementById('accuracy-rate').textContent = '78%';
      document.getElementById('total-points').textContent = '1,850';
      document.getElementById('streak-count').textContent = '🔥 5';
      document.getElementById('user-name').textContent = '张三的学习数据';

      // 初始化仪表板
      await statsDashboard.init(userId, null);

      // 渲染知识点列表
      renderKnowledgeList();
    });

    function renderKnowledgeList() {
      const list = document.getElementById('knowledge-list');
      const data = statsDashboard.data.knowledgeMastery;

      list.innerHTML = data.map(kp => {
        const percentage = Math.round((kp.mastered / kp.total) * 100);
        const color = percentage >= 80 ? '#4caf50' : percentage >= 60 ? '#ff9800' : '#f44336';
        return `
          <li class="knowledge-item">
            <span class="name">${kp.name}</span>
            <div class="bar-container">
              <div class="bar-fill" style="width: ${percentage}%; background: ${color};"></div>
            </div>
            <span class="percentage" style="color: ${color};">${percentage}%</span>
          </li>
        `;
      }).join('');
    }
  </script>
</body>
</html>
